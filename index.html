<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Face ID - Rajab Xo'jamov nomidagi o'rta maktabi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

    header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.3rem; color: #38bdf8; }

    .lang-btns button { background: #334155; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
    .lang-btns button.active { background: #0284c7; }

    .camera-container { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4 / 3; background: #1e293b; border-radius: 16px; overflow: hidden; border: 3px solid #334155; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .result-card { margin-top: 20px; width: 100%; max-width: 640px; background: #1e293b; padding: 20px; border-radius: 16px; border-left: 6px solid #64748b; transition: all 0.2s ease; text-align: center; }
    .result-card.success { border-left-color: #22c55e; background: #064e3b; }
    .result-card.late { border-left-color: #ef4444; background: #7f1d1d; }
    .result-card.unknown { border-left-color: #f59e0b; background: #451a03; }
    .result-card.error { border-left-color: #dc2626; background: #450a0a; }

    .check-icon { font-size: 3.5rem; display: none; line-height: 1; margin-bottom: 8px; }
    .status-text { font-size: 1.3rem; font-weight: bold; margin-bottom: 8px; }
    .teacher-info { font-size: 1.1rem; color: #e2e8f0; }
    .time-badge { display: inline-block; margin-top: 10px; padding: 6px 14px; background: rgba(255,255,255,0.2); border-radius: 20px; font-size: 1rem; font-weight: bold; }

    .hint { margin-top: 14px; font-size: 0.8rem; color: #64748b; text-align: center; max-width: 640px; }
  </style>

  <!-- Firebase (umumiy baza — barcha qurilmalarda bir xil ma'lumot) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Face-api.js: kutubxona jsdelivr'dan (GitHub Pages demo saytiga qaraganda ishonchliroq) -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

  <header>
    <h1 id="app-title">Ражаб Хожамов атындагы орто мектеби</h1>
    <div class="lang-btns">
      <button id="btn-ru" class="active" onclick="switchLang('ru')">RU</button>
      <button id="btn-kg" onclick="switchLang('kg')">KG</button>
    </div>
  </header>

  <div class="camera-container">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div id="result-card" class="result-card">
    <div id="check-icon" class="check-icon">✅</div>
    <div id="status-text" class="status-text">Загрузка системы...</div>
    <div id="teacher-info" class="teacher-info">Пожалуйста, смотрите в камеру</div>
    <div id="time-badge" class="time-badge" style="display:none;">--:--</div>
  </div>

  <div class="hint" id="hint-text"></div>

</body>
</html>
